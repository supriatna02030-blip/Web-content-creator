<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0d12">
<title>Creator Rate Card Calculator</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:#080a0f;
  color:#f5f7fb;
  min-height:100vh;
}

.container{
  width:min(1100px,94%);
  margin:auto;
  padding:25px 0 50px;
}

.header{
  text-align:center;
  padding:25px 10px 30px;
}

.logo{
  display:inline-flex;
  width:55px;
  height:55px;
  border-radius:16px;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#7c3aed,#2563eb);
  font-size:27px;
  margin-bottom:15px;
}

.header h1{
  font-size:30px;
  margin-bottom:8px;
}

.header p{
  color:#9299a8;
  font-size:14px;
}

.grid{
  display:grid;
  grid-template-columns:380px 1fr;
  gap:20px;
}

.card{
  background:#11141b;
  border:1px solid #222733;
  border-radius:20px;
  padding:22px;
  box-shadow:0 10px 35px rgba(0,0,0,.2);
}

.card-title{
  font-size:17px;
  font-weight:700;
  margin-bottom:20px;
}

.form-group{
  margin-bottom:17px;
}

label{
  display:block;
  font-size:13px;
  color:#aeb5c3;
  margin-bottom:8px;
}

input,select{
  width:100%;
  background:#0a0d13;
  color:#fff;
  border:1px solid #29303d;
  border-radius:12px;
  padding:13px 14px;
  outline:none;
  font-size:14px;
}

input:focus,select:focus{
  border-color:#6d5dfc;
  box-shadow:0 0 0 3px rgba(109,93,252,.12);
}

.input-wrap{
  position:relative;
}

.suffix{
  position:absolute;
  right:13px;
  top:13px;
  color:#737b8a;
  font-size:13px;
}

.tier{
  padding:14px;
  border-radius:14px;
  background:linear-gradient(135deg,#191c29,#121520);
  border:1px solid #30364a;
  margin-bottom:18px;
}

.tier-label{
  color:#8f98ab;
  font-size:12px;
}

.tier-name{
  font-size:23px;
  font-weight:800;
  margin-top:3px;
}

.result-price{
  text-align:center;
  padding:20px 10px 23px;
  background:linear-gradient(135deg,#171327,#10131d);
  border-radius:18px;
  border:1px solid #342d57;
  margin-bottom:18px;
}

.result-price small{
  color:#a7adbb;
}

.price{
  font-size:32px;
  font-weight:900;
  margin-top:7px;
  background:linear-gradient(90deg,#a78bfa,#60a5fa);
  -webkit-background-clip:text;
  color:transparent;
}

.price-sub{
  color:#8c94a5;
  font-size:13px;
  margin-top:5px;
}

.breakdown{
  margin-top:15px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:11px 0;
  border-bottom:1px solid #202530;
  font-size:13px;
}

.row:last-child{
  border-bottom:0;
}

.row span:first-child{
  color:#9da5b5;
}

.row strong{
  color:#fff;
}

.section{
  margin-top:20px;
}

.section-title{
  font-size:15px;
  font-weight:700;
  margin-bottom:12px;
}

.tip{
  padding:13px;
  background:#0d1118;
  border:1px solid #252c38;
  border-radius:12px;
  color:#aeb5c3;
  font-size:13px;
  line-height:1.6;
  margin-bottom:8px;
}

.tip b{
  color:#fff;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}

button{
  flex:1;
  border:0;
  border-radius:12px;
  padding:13px;
  font-weight:700;
  cursor:pointer;
  font-size:14px;
}

.btn-primary{
  background:linear-gradient(135deg,#7c3aed,#2563eb);
  color:#fff;
}

.btn-secondary{
  background:#202530;
  color:#fff;
}

.footer{
  text-align:center;
  color:#626a78;
  font-size:12px;
  margin-top:25px;
}
